<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="C Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#202020">
<title>C Studio</title>
<style>
:root{
  --bg:#202020;--surf:#2b2b2b;--surf2:#323232;--hov:#3a3a3a;--line:#404040;--tx:#ffffff;--mut:#a6a6a6;
  --acc:#60cdff;--onacc:#000;--ok:#6ccb5f;--er:#ff99a4;--wr:#fce100;
  --k:#569cd6;--k2:#c586c0;--t:#4ec9b0;--s:#ce9178;--n:#b5cea8;--c:#6a9955;--f:#dcdcaa;--p:#c586c0;
  --term:#0c0c0c;--termtx:#cccccc;--sh:0 8px 24px rgba(0,0,0,.45);--fs:14px;
  --ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"SF Pro Text",sans-serif;
  --mono:"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{
  --bg:#f3f3f3;--surf:#ffffff;--surf2:#fbfbfb;--hov:#eaeaea;--line:#dcdcdc;--tx:#1b1b1b;--mut:#616161;
  --acc:#0067c0;--onacc:#fff;--ok:#0f7b0f;--er:#c42b1c;--wr:#9d5d00;
  --k:#0000ff;--k2:#af00db;--t:#267f99;--s:#a31515;--n:#098658;--c:#008000;--f:#795e26;--p:#af00db;--sh:0 8px 24px rgba(0,0,0,.18)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-text-size-adjust:100%}
#app{max-width:900px;margin:auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 92px)}
button{font:inherit;color:inherit;cursor:pointer}
.bv{background:var(--surf2);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-size:14px;font-weight:500;
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bv:hover{background:var(--hov)}.bv:active{opacity:.75}
.bv:disabled{opacity:.5}
.bv.pri{background:var(--acc);color:var(--onacc);border-color:transparent;font-weight:600}
.bv.pri:hover{filter:brightness(1.06)}
.bv svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;fill:currentColor}
/* cabecera */
.cab{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.logo{width:28px;height:28px;border-radius:6px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:700 15px var(--mono)}
.cab b{font-size:15px;font-weight:600}
.cab .sp{flex:1}
.cab .h{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.sub{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0 4px 10px;color:var(--mut);font-size:13px}

.pill{background:var(--surf);border:1px solid var(--line);border-radius:5px;padding:4px 9px;font-variant-numeric:tabular-nums;color:var(--tx);font-size:13px}
.pill i{font-style:normal;color:var(--acc);font-weight:600}
/* pestaña + editor */
.pest{display:flex;align-items:flex-end;padding-left:2px}
.pest div{background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:7px 14px;font-size:13px;display:flex;gap:8px;align-items:center;
  box-shadow:inset 0 2px 0 var(--acc)}
.pest span{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.0}
.frame{background:var(--surf);border:1px solid var(--line);border-radius:0 8px 8px 8px;overflow:hidden;box-shadow:var(--sh)}
.ed{position:relative;display:flex;max-height:52vh;min-height:270px;overflow:auto;overscroll-behavior:contain}
.gut{position:sticky;left:0;z-index:2;flex:none;padding:12px 10px 12px 12px;text-align:right;color:var(--mut);opacity:.9;background:var(--surf);
  font:var(--fs)/1.55 var(--mono);white-space:pre;user-select:none}
.gut .bad{color:var(--er);font-weight:700}
.stack{position:relative;flex:1;min-width:max-content}
pre.hl,textarea#code{margin:0;padding:12px 14px 12px 6px;font:var(--fs)/1.55 var(--mono);white-space:pre;tab-size:4}
pre.hl{pointer-events:none;color:var(--tx);min-height:100%}
textarea#code{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;overflow:hidden;
  background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--acc)}
textarea#code::selection{background:color-mix(in srgb,var(--acc) 35%,transparent);-webkit-text-fill-color:transparent}
.k{color:var(--k)}.t{color:var(--t)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c)}.p{color:var(--p)}.f{color:var(--f)}
pre.hl .k{color:var(--k)}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);background:var(--surf2);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:38px;padding:7px 8px;font:500 15px var(--mono)}
/* barra de comandos */
.barra{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
.barra>div{max-width:900px;margin:auto;display:flex;gap:8px}
.barra .bv{flex:1;min-width:0;padding:11px 2px;white-space:nowrap;font-size:12.5px}
.barra .bv svg{margin-right:3px;width:14px;height:14px}
.barra #run{flex:1.2;font-size:14px}
/* ventanas */
.vel{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);padding:calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.vel.on{display:flex;flex-direction:column;justify-content:center}
.win{margin:auto;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;background:var(--surf);color:var(--tx);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.win .bar{padding:14px 16px 8px;font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.win .bar button{background:none;border:0;border-radius:5px;color:var(--mut);font-size:13px;padding:5px 9px}
.win .bar button:hover{background:var(--hov);color:var(--tx)}
.win .cu{overflow:auto;padding:6px 12px 12px;flex:1}
.win .pie{padding:12px;border-top:1px solid var(--line);background:var(--surf2);font-size:13px}
.it{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:5px;margin-bottom:2px;color:var(--tx)}
.it:hover{background:var(--hov)}
.it.cur{background:var(--hov);box-shadow:inset 3px 0 0 var(--acc)}
.it .i{flex:1;min-width:0;cursor:pointer}.it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.it small{color:var(--mut);font-size:12px}
.it .bv{padding:5px 9px;font-size:12px}
.menu .it{cursor:pointer}
.menu h4{margin:12px 8px 4px;font-size:12px;font-weight:600;color:var(--mut)}
/* salida: terminal */
.dos{background:var(--term);border-color:var(--line)}
.dos .bar{color:#fff;padding:12px 16px 6px}
.dos .bar button{color:#bbb}
.dos .cu{background:var(--term);color:var(--termtx);padding:6px 16px 14px;font:14px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;min-height:150px}
.dos .e{color:#f1707b}.dos .w{color:#fce100}
#ent{display:inline-block;width:70%;min-width:8ch;background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:0;margin:0;caret-color:#60cdff}.dos a{color:#60cdff;text-decoration:underline;text-underline-offset:3px}
.dos .pie{background:#171717;color:#bbb;border-top:1px solid #2c2c2c;display:flex;gap:10px;justify-content:space-between;align-items:center}
.est{display:flex;align-items:center;gap:8px;font-weight:600}
.est::before{content:"";width:9px;height:9px;border-radius:50%;background:#888}
.est.ok{color:#6ccb5f}.est.ok::before{background:#6ccb5f}
.est.er{color:#ff99a4}.est.er::before{background:#ff99a4}
.est.ru{color:#fce100}.est.ru::before{background:#fce100}
.aviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);z-index:40;background:var(--surf2);color:var(--tx);
  border:1px solid var(--line);border-radius:6px;padding:9px 14px;font-size:14px;box-shadow:var(--sh);display:none}
.aviso.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div class="cab">
    <div class="logo">C</div><b>C Studio</b><span class="sp"></span>
    <span class="h" id="hora">--:--:--</span>
  </div>
  <div class="sub"><span id="fecha"></span><span class="pill" id="cuenta"></span></div>
  <div class="pest"><div><b id="nombre" style="font-weight:500">programa1.c</b></div></div>
  <div class="frame">
    <div class="ed" id="ed">
      <div class="gut" id="gut">1</div>
      <div class="stack">
        <pre class="hl" id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Código C"></textarea>
      </div>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</div>

<div class="barra"><div>
  <button class="bv" id="bMenu"><svg viewBox="0 0 16 16"><path d="M2 3.5h12v1.4H2zm0 3.8h12v1.4H2zm0 3.8h12v1.4H2z"/></svg>Menú</button>
  <button class="bv" id="bSave"><svg viewBox="0 0 16 16"><path d="M3 1.5h8.6L14.5 4.4V13a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 13V3A1.5 1.5 0 0 1 3 1.5zm1 1.4v3h6v-3zm0 6v4.6h8V8.9z"/></svg>Guardar</button>
  <button class="bv" id="bGua"><svg viewBox="0 0 16 16"><path d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.2l1.5 1.7H13A1.5 1.5 0 0 1 14.5 4.7V12A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/></svg>Guardados</button>
  <button class="bv pri" id="run"><svg viewBox="0 0 16 16"><path d="M4 2.2v11.6a.6.6 0 0 0 .9.5l9-5.8a.6.6 0 0 0 0-1L4.9 1.7a.6.6 0 0 0-.9.5z"/></svg>Ejecutar</button>
</div></div>

<!-- salida: solo aparece al ejecutar -->
<div class="vel" id="vSal"><div class="win dos">
  <div class="bar"><span>Salida</span><button id="sCerrar">Cerrar</button></div>
  <div class="cu" id="out"></div>
  <div class="pie"><span class="est" id="est"></span><span id="ms"></span></div>
</div></div>

<!-- ventana general -->
<div class="vel" id="vDlg"><div class="win">
  <div class="bar"><span id="dT"></span><button id="dX">Cerrar</button></div>
  <div class="cu" id="dC"></div>
  <div class="pie" id="dP" style="display:none"></div>
</div></div>
<div class="aviso" id="aviso"></div>
<input type="file" id="fImp" accept=".c,.h,.txt,text/plain" multiple hidden>
<input type="file" id="fRes" accept=".json,application/json" hidden>

<script>
const EJ={
"Hola mundo":`#include <stdio.h>

int main(void) {
    printf("Hola, mundo!\\n");
    return 0;
}
`,
"Pide dos números (scanf)":`#include <stdio.h>

int main(void) {
    int a, b;
    printf("Primer número: ");
    scanf("%d", &a);
    printf("Segundo número: ");
    scanf("%d", &b);
    printf("La suma es %d\\n", a + b);
    return 0;
}
`,
"Suma de dos números":`#include <stdio.h>

int main(void) {
    int a = 3, b = 4;
    printf("%d + %d = %d\\n", a, b, a + b);
    return 0;

`,
"Bucle for: tabla del 5":`#include <stdio.h>

int main(void) {
    for (int i = 1; i <= 10; i++) {
        printf("5 x %d = %d\\n", i, 5 * i);
    }

`,
"if / else: par o impar":`#include <stdio.h>

int main(void) {
    for (int n = 1; n <= 6; n++) {
        if (n % 2 == 0) {
            printf("%d es par\\n", n);
        } else {
            printf("%d es impar\\n", n);
        }
    }
    return 0;
}
`,
"while: potencias de 2":`#include <stdio.h>

int main(void) {
    int x = 1;
    while (x < 200) {
        printf("%d\\n", x);
        x *= 2;
    }
    return 0;
}
`,
"Array: media y máximo":`#include <stdio.h>

int main(void) {
    int v[5] = {4, 8, 15, 16, 23};
    int suma = 0, max = v[0];
    for (int i = 0; i < 5; i++) {
        suma += v[i];
        if (v[i] > max) max = v[i];
    }
    printf("Media: %.2f\\n", suma / 5.0);
    printf("Máximo: %d\\n", max);
    return 0;
}
`,
"Función: factorial":`#include <stdio.h>

long factorial(int n) {
    if (n <= 1) return 1;
    return n * factorial(n - 1);
}

int main(void) {
    for (int i = 0; i <= 10; i++)
        printf("%d! = %ld\\n", i, factorial(i));
    return 0;
}
`,
"Cadenas y punteros":`#include <stdio.h>
#include <string.h>

int main(void) {
    char s[] = "programacion";
    int n = strlen(s);
    printf("Longitud: %d\\n", n);
    for (char *p = s + n - 1; p >= s; p--) putchar(*p);
    putchar('\\n');
    return 0;
}
`,
"Struct: alumnos":`#include <stdio.h>

struct Alumno {
    char nombre[20];
    float nota;
};

int main(void) {
    struct Alumno a[3] = {{"Ana", 8.5f}, {"Luis", 6.0f}, {"Marta", 9.25f}};
    float suma = 0;
    for (int i = 0; i < 3; i++) {
        printf("%-6s %.2f\\n", a[i].nombre, a[i].nota);
        suma += a[i].nota;
    }
    printf("Media: %.2f\\n", suma / 3);
    return 0;
}
`,
"Con un error (para practicar)":`#include <stdio.h>

int main(void) {
    int x = 5
    printf("%d\\n", x);
    return 0;
}
`};
const CABECERA="#define _GNU_SOURCE\n#include <stdio.h>\n#include <stdlib.h>\n#include <stdarg.h>\n#include <string.h>\n#include <unistd.h>\nstatic char *__cs_b; static long __cs_n; static FILE *__cs_in; static long *__cs_ls; static int __cs_nl, __cs_eli;\n__attribute__((constructor,unused)) static void __cs_init(void){\n  long cap=4096; __cs_b=malloc(cap+2); __cs_n=0; size_t r;\n  while((r=fread(__cs_b+__cs_n,1,cap-__cs_n,stdin))>0){ __cs_n+=r; if(__cs_n>=cap){cap*=2;__cs_b=realloc(__cs_b,cap+2);} }\n  __cs_b[__cs_n]=0;\n  if(__cs_n==0){ __cs_in=fmemopen(__cs_b,1,\"r\"); fseek(__cs_in,0,SEEK_END); }\n  else __cs_in=fmemopen(__cs_b,__cs_n,\"r\");\n  __cs_ls=malloc(sizeof(long)*(__cs_n+2)); long s=0;\n  for(long i=0;i<__cs_n;i++) if(__cs_b[i]=='\\n'){ __cs_ls[__cs_nl++]=s; s=i+1; }\n  if(s<__cs_n) __cs_ls[__cs_nl++]=s;\n  __cs_ls[__cs_nl]=__cs_n;\n}\nstatic void __cs_echo(void){\n  long pos=ftell(__cs_in);\n  while(__cs_eli<__cs_nl && pos>__cs_ls[__cs_eli]){\n    long a=__cs_ls[__cs_eli], b=__cs_ls[__cs_eli+1]; if(b>a && __cs_b[b-1]=='\\n') b--;\n    fwrite(__cs_b+a,1,b-a,stdout); fputc('\\n',stdout); __cs_eli++;\n  }\n}\nstatic void __cs_need(void){ __cs_echo(); fflush(stdout); fputs(\"\\n@@NEED@@\",stderr); fflush(stderr); _exit(0); }\n__attribute__((format(scanf,1,2),unused)) static int __cs_scanf(const char *f,...){\n  va_list a; va_start(a,f); int r=vfscanf(__cs_in,f,a); va_end(a);\n  if(feof(__cs_in)){ __cs_need(); } __cs_echo(); return r; }\n__attribute__((unused)) static int __cs_fscanf(FILE *fp,const char *f,...){\n  va_list a; va_start(a,f); int r;\n  if(fp==stdin){ r=vfscanf(__cs_in,f,a); va_end(a); if(feof(__cs_in)) __cs_need(); __cs_echo(); }\n  else { r=vfscanf(fp,f,a); va_end(a); }\n  return r; }\n__attribute__((unused)) static int __cs_getchar(void){ int c=fgetc(__cs_in); if(c==EOF) __cs_need(); __cs_echo(); return c; }\n__attribute__((unused)) static char *__cs_fgets(char *b,int n,FILE *fp){\n  if(fp!=stdin) return fgets(b,n,fp);\n  char *r=fgets(b,n,__cs_in); if(!r) __cs_need(); __cs_echo(); return r; }\n#define scanf(...) __cs_scanf(__VA_ARGS__)\n#define fscanf(...) __cs_fscanf(__VA_ARGS__)\n#define getchar() __cs_getchar()\n#define fgets(b,n,f) __cs_fgets(b,n,f)\n#line 1 \"prog.c\"\n";
const PLANTILLA=`#include <stdio.h>

int main(void) {
    
    return 0;
}
`;
const $=id=>document.getElementById(id);
const safe=f=>{try{return f()}catch(e){return null}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KEY='cstudio.v2';
let S=safe(()=>JSON.parse(localStorage.getItem(KEY)))||null;
const uid=()=>Math.random().toString(36).slice(2,9);
if(!S||!S.files||!S.files.length){
  const f={id:uid(),name:'programa1.c',code:safe(()=>localStorage.getItem('cstudio.code'))||EJ["Hola mundo"],t:Date.now()};
  S={files:[f],cur:f.id,fs:14};
}
S.saved=S.saved||[];S.fs=S.fs||14;
const save=()=>safe(()=>localStorage.setItem(KEY,JSON.stringify(S)));
const cur=()=>S.files.find(f=>f.id===S.cur)||S.files[0];

/* reloj y cuenta atrás al viernes */
const p2=n=>String(n).padStart(2,'0');
function tic(){
  const n=new Date();
  $('hora').textContent=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
  const fe=n.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});$('fecha').textContent=fe.charAt(0).toUpperCase()+fe.slice(1);
  const dif=(5-n.getDay()+7)%7;
  if(dif===0){$('cuenta').innerHTML='<i>¡Hoy es viernes!</i>';return}
  const objetivo=new Date(n.getFullYear(),n.getMonth(),n.getDate()+dif,0,0,0);
  const ms=objetivo-n,d=Math.floor(ms/864e5),r=ms-d*864e5;
  const h=Math.floor(r/36e5),m=Math.floor(r%36e5/6e4),s=Math.floor(r%6e4/1e3);
  const dia=objetivo.toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','');
  $('cuenta').innerHTML='Viernes '+dia+' · faltan <i>'+d+(d===1?' día':' días')+'</i> '+p2(h)+':'+p2(m)+':'+p2(s);
}
tic();setInterval(tic,1000);

/* resaltado */
const KW=new Set("auto break case const continue default do else enum extern for goto if inline register restrict return sizeof static struct switch typedef union volatile while".split(' '));
const TY=new Set("int char float double void long short signed unsigned size_t FILE bool NULL EOF true false uint8_t uint16_t uint32_t uint64_t int8_t int16_t int32_t int64_t".split(' '));
const RX=/(\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*)|(^[ \t]*#[^\n]*)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b0[xX][0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?[fFuUlL]*\b)|([A-Za-z_]\w*)(\s*\()?/gm;
function resaltar(src){
  let o='',i=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    o+=esc(src.slice(i,m.index));i=RX.lastIndex;
    if(m[1]!==undefined)o+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2]!==undefined)o+='<span class="p">'+esc(m[2])+'</span>';
    else if(m[3]!==undefined)o+='<span class="s">'+esc(m[3])+'</span>';
    else if(m[4]!==undefined)o+='<span class="n">'+esc(m[4])+'</span>';
    else{const w=m[5];
      if(KW.has(w))o+='<span class="k">'+w+'</span>'+(m[6]||'');
      else if(TY.has(w))o+='<span class="t">'+w+'</span>'+(m[6]||'');
      else if(m[6])o+='<span class="f">'+w+'</span>'+m[6];
      else o+=w}
    if(m[0]==='')RX.lastIndex++;
  }
  return o+esc(src.slice(i));
}
let malas=new Set();
const code=$('code');
function render(){
  const c=code.value;$('hl').innerHTML=resaltar(c)+'\n ';
  const n=c.split('\n').length;let g='';
  for(let i=1;i<=n;i++)g+=(malas.has(i)?'<span class="bad">'+i+'</span>':i)+'\n';
  $('gut').innerHTML=g.replace(/\n$/,'');
}
code.addEventListener('input',()=>{cur().code=code.value;cur().t=Date.now();malas.clear();render();save()});
function ins(t){const a=code.selectionStart,b=code.selectionEnd;code.setRangeText(t,a,b,'end');code.dispatchEvent(new Event('input'));code.focus()}
code.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();ins('    ')}
  if(e.key==='Enter'){
    const a=code.selectionStart,v=code.value,ini=v.lastIndexOf('\n',a-1)+1,ln=v.slice(ini,a);
    let ind=(ln.match(/^\s*/)||[''])[0];if(/\{\s*$/.test(ln))ind+='    ';
    e.preventDefault();ins('\n'+ind);
  }
});
const TECLAS=['    ','{','}','(',')','[',']',';','"',"'",'&','*','%','<','>','=','!','#','\\n'];
$('keys').innerHTML=TECLAS.map((k,i)=>`<button class="bv" data-i="${i}">${k==='    '?'Tab':k==='\\n'?'\\n':k}</button>`).join('');
$('keys').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();ins(TECLAS[b.dataset.i])});

function cargar(){const f=cur();S.cur=f.id;code.value=f.code;
  $('nombre').textContent=f.name;malas.clear();render();save()}
function aplicarFs(){document.documentElement.style.setProperty('--fs',S.fs+'px');render()}

let at;function aviso(t){const e=$('aviso');e.textContent=t;e.classList.add('on');clearTimeout(at);at=setTimeout(()=>e.classList.remove('on'),1800)}

/* ventana general */
let dClick=null;
function dlg(titulo,html,click,pie){
  $('dT').textContent=titulo;$('dC').innerHTML=html;dClick=click;
  const p=$('dP');if(pie){p.style.display='';p.innerHTML=pie}else p.style.display='none';
  $('vDlg').classList.add('on');
}
const cerrarDlg=()=>$('vDlg').classList.remove('on');
$('dX').onclick=cerrarDlg;
$('dC').addEventListener('click',e=>{if(dClick)dClick(e)});
$('dP').addEventListener('click',e=>{if(dClick)dClick(e)});

function nuevo(nombre,codigo){
  const nombres=new Set(S.files.map(f=>f.name));
  let base=(nombre||'programa').replace(/\.c$/i,''),n=1,nom=base+'.c';
  while(nombres.has(nom)){n++;nom=base+n+'.c'}
  const f={id:uid(),name:nom,code:codigo,t:Date.now()};S.files.push(f);S.cur=f.id;cargar();return f;
}
const norm=n=>{let x=(n||'').trim().replace(/[\\/:*?"<>|]/g,'_');if(!x)return '';return /\.c$/i.test(x)?x:x+'.c'};
const nl=s=>s.split('\n').length;
const fch=t=>new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' '+new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
function descargar(nombre,texto,tipo){const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([texto],{type:tipo||'text/plain'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove()}

/* Mis programas (los que estás editando) */
function vProgramas(){
  const l=[...S.files].sort((a,b)=>b.t-a.t);
  dlg('Programas abiertos',l.map(f=>`<div class="it ${f.id===S.cur?'cur':''}" data-id="${f.id}">
    <div class="i" data-a="abrir"><b>${esc(f.name)}</b><small>${nl(f.code)} líneas · ${fch(f.t)}</small></div>
    ${S.files.length>1?'<button class="bv" data-a="del">Borrar</button>':''}</div>`).join(''),e=>{
    const it=e.target.closest('.it');if(!it)return;const a=e.target.closest('[data-a]');if(!a)return;
    const f=S.files.find(x=>x.id===it.dataset.id);
    if(a.dataset.a==='abrir'){S.cur=f.id;cargar();cerrarDlg()}
    if(a.dataset.a==='del'&&confirm('¿Borrar «'+f.name+'»? (los archivos guardados no se tocan)')){
      S.files=S.files.filter(x=>x!==f);if(S.cur===f.id)S.cur=S.files[0].id;cargar();vProgramas()}
  });
}
/* Guardar y archivos guardados */
function guardarArchivo(){
  const f=cur();const n=norm(prompt('Guardar como:',f.name));if(!n)return;
  const ex=S.saved.find(x=>x.name===n);
  if(ex){if(!confirm('Ya existe «'+n+'» en guardados. ¿Sobrescribir?'))return;ex.code=f.code;ex.t=Date.now()}
  else S.saved.push({id:uid(),name:n,code:f.code,t:Date.now()});
  save();aviso('Guardado: '+n);
  if($('vDlg').classList.contains('on')&&$('dT').textContent==='Archivos guardados')vGuardados();
}
function vGuardados(){
  const l=[...S.saved].sort((a,b)=>b.t-a.t);
  dlg('Archivos guardados',(l.length?l.map(f=>`<div class="it" data-id="${f.id}">
    <div class="i" data-a="open"><b>${esc(f.name)}</b><small>${nl(f.code)} líneas · ${fch(f.t)}</small></div>
    <button class="bv" data-a="exp">.c</button><button class="bv" data-a="del">X</button></div>`).join('')
    :'<div class="it"><div class="i"><small>Todavía no hay archivos guardados. Pulsa «Guardar actual».</small></div></div>'),e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='nuevoG'){guardarArchivo();return}
    if(b.dataset.a==='imp'){$('fImp').click();return}
    if(b.dataset.a==='bak'){descargar('cstudio-copia.json',JSON.stringify({v:2,files:S.files,saved:S.saved}),'application/json');aviso('Copia exportada');return}
    if(b.dataset.a==='res'){$('fRes').click();return}
    const it=b.closest('.it');if(!it)return;const f=S.saved.find(x=>x.id===it.dataset.id);if(!f)return;
    if(b.dataset.a==='open'){nuevo(f.name,f.code);cerrarDlg();aviso('Abierto: '+f.name)}
    if(b.dataset.a==='exp'){descargar(f.name,f.code);aviso('Exportado')}
    if(b.dataset.a==='del'&&confirm('¿Borrar «'+f.name+'» de guardados?')){S.saved=S.saved.filter(x=>x!==f);save();vGuardados()}
  },`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
    <button class="bv pri" data-a="nuevoG">Guardar actual</button><button class="bv" data-a="imp">Importar .c</button>
    <button class="bv" data-a="bak">Copia de todo</button><button class="bv" data-a="res">Restaurar copia</button></div>`);
}
$('fImp').onchange=async e=>{let n=0;
  for(const f of e.target.files){const t=await f.text();const nm=norm(f.name.replace(/\.[^.]+$/,''));
    const ex=S.saved.find(x=>x.name===nm);if(ex){ex.code=t;ex.t=Date.now()}else S.saved.push({id:uid(),name:nm,code:t,t:Date.now()});n++}
  save();vGuardados();aviso(n+' importado'+(n===1?'':'s'));e.target.value=''};
$('fRes').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());let n=0;
    for(const x of (d.saved||[]))if(!S.saved.some(y=>y.name===x.name)){S.saved.push({id:uid(),name:x.name,code:x.code,t:x.t||Date.now()});n++}
    for(const x of (d.files||[]))if(!S.saved.some(y=>y.name===x.name)){S.saved.push({id:uid(),name:x.name,code:x.code,t:x.t||Date.now()});n++}
    save();vGuardados();aviso(n+' restaurado'+(n===1?'':'s'))}catch(err){aviso('Copia no válida')}
  e.target.value=''};
/* Ejemplos */
function vEjemplos(){
  dlg('Ejemplos',Object.keys(EJ).map(k=>`<div class="it" data-k="${esc(k)}"><div class="i"><b>${esc(k)}</b></div></div>`).join(''),e=>{
    const it=e.target.closest('.it');if(!it)return;
    nuevo(it.dataset.k.replace(/[^\wáéíóúñ ]/gi,'').trim().replace(/\s+/g,'_').toLowerCase(),EJ[it.dataset.k]);cerrarDlg();aviso('Ejemplo cargado')});
}
/* Menú */
function sangrar(){let nivel=0;
  code.value=code.value.split('\n').map(l=>{const t=l.trim();if(!t)return '';
    const c=(t.match(/^\}+/)||[''])[0].length,n=Math.max(0,nivel-c);
    nivel+=(t.match(/\{/g)||[]).length-(t.match(/\}/g)||[]).length;if(nivel<0)nivel=0;return '    '.repeat(n)+t}).join('\n');
  code.dispatchEvent(new Event('input'))}
const ACC={
 nuevo:()=>{nuevo('programa',PLANTILLA);cerrarDlg();aviso('Programa nuevo')},
 abiertos:vProgramas,ejemplos:vEjemplos,guardados:vGuardados,
 ren:()=>{const n=norm(prompt('Nombre del programa:',cur().name));if(n){cur().name=n;cargar();cerrarDlg()}},
 dup:()=>{nuevo(cur().name.replace(/\.c$/,'')+'_copia',cur().code);cerrarDlg();aviso('Duplicado')},
 copiar:async()=>{try{await navigator.clipboard.writeText(code.value);aviso('Código copiado')}catch(e){aviso('No se pudo copiar')}cerrarDlg()},
 exp:()=>{descargar(cur().name,cur().code);cerrarDlg();aviso('Exportado')},
 sang:()=>{sangrar();cerrarDlg();aviso('Código sangrado')},
 mas:()=>{S.fs=Math.min(22,S.fs+1);aplicarFs();save();aviso('Letra '+S.fs)},
 menos:()=>{S.fs=Math.max(11,S.fs-1);aplicarFs();save();aviso('Letra '+S.fs)}
};
function vMenu(){
  const it=(k,t)=>`<div class="it" data-m="${k}"><div class="i"><b>${t}</b></div></div>`;
  dlg('Menú','<div class="menu"><h4>Programa</h4>'+it('nuevo','Nuevo programa')+it('abiertos','Programas abiertos')+it('ejemplos','Ejemplos')
   +it('ren','Cambiar nombre')+it('dup','Duplicar')+'<h4>Archivos</h4>'+it('guardados','Archivos guardados')+it('exp','Exportar como .c')+it('copiar','Copiar código')
   +'<h4>Editor</h4>'+it('sang','Sangrar el código')+it('mas','Letra más grande')+it('menos','Letra más pequeña')+'</div>',e=>{
    const i=e.target.closest('[data-m]');if(i)ACC[i.dataset.m]()});
}
$('bMenu').onclick=vMenu;$('bSave').onclick=guardarArchivo;$('bGua').onclick=vGuardados;

/* salida (solo al ejecutar) */
const salida=$('vSal');
function estado(c,t,ms){const e=$('est');e.className='est '+c;e.textContent=t;$('ms').textContent=ms||''}
$('sCerrar').onclick=()=>{corrida++;salida.classList.remove('on')};
function irALinea(n){
  corrida++;salida.classList.remove('on');
  const lines=code.value.split('\n');let off=0;for(let i=0;i<n-1&&i<lines.length;i++)off+=lines[i].length+1;
  const lh=parseFloat(getComputedStyle(code).lineHeight);
  $('ed').scrollTop=Math.max(0,(n-1)*lh-60);code.setSelectionRange(off,off+(lines[n-1]||'').length);
}
$('out').addEventListener('click',e=>{const a=e.target.closest('a[data-l]');if(a)irALinea(+a.dataset.l)});
let compilador=null;
async function elegir(){
  if(compilador)return compilador;
  try{const l=await (await fetch('https://wandbox.org/api/list.json')).json();
    const c=l.filter(x=>x.language==='C'&&/^gcc-/.test(x.name));
    compilador=(c.find(x=>x.name==='gcc-head-c')||c[0]||{}).name||'gcc-head-c';
  }catch(e){compilador='gcc-head-c'}
  return compilador;
}
const run=$('run');
let corrida=0,entradas=[];
function pintarSalida(h,espera){
  const o=$('out');o.innerHTML=h;
  if(espera){
    const i=document.createElement('input');i.id='ent';i.setAttribute('autocapitalize','off');i.setAttribute('autocomplete','off');
    i.setAttribute('autocorrect','off');i.setAttribute('spellcheck','false');i.setAttribute('enterkeyhint','send');
    i.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;e.preventDefault();
      entradas.push(i.value);i.disabled=true;ejecutar();
    });
    o.appendChild(i);setTimeout(()=>i.focus(),50);
  }
  const c=o.parentElement;c.scrollTop=c.scrollHeight;
}
$('out').addEventListener('click',e=>{if(e.target.id!=='ent'){const i=$('ent');if(i&&!i.disabled)i.focus()}});
async function ejecutar(){
  const mi=++corrida;
  estado('ru',entradas.length?'Ejecutando…':'Compilando…','');
  const t0=performance.now();
  try{
    const comp=await elegir();
    const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),30000);
    const pedir=raw=>fetch('https://wandbox.org/api/compile.json',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({code:CABECERA+code.value,compiler:comp,stdin:entradas.map(l=>l+'\n').join(''),save:false,'compiler-option-raw':raw})});
    let r=await pedir('-Wall\n-lm');
    if(!r.ok)r=await pedir('-Wall');
    clearTimeout(to);
    if(!r.ok)throw new Error('El servidor respondió '+r.status);
    const d=await r.json();
    if(mi!==corrida)return;
    const ms=((performance.now()-t0)/1000).toFixed(1)+' s';
    const cerr=(d.compiler_error||'').trim(),st=String(d.status??''),out=d.program_output||'';
    const perr=d.program_error||'',espera=perr.includes('@@NEED@@'),perr2=perr.replace(/\n?@@NEED@@/,'');
    const fallo=cerr&&(st!=='0')&&!out&&!espera;
    let h='';
    if(cerr){h+='<span class="'+(fallo?'e':'w')+'">'+esc(cerr).replace(/prog\.c:(\d+)(?::\d+)?/g,(m,l)=>`<a data-l="${l}">línea ${l}</a>`)+'</span>\n\n';
      malas.clear();for(const m of cerr.matchAll(/prog\.c:(\d+):\d+: (?:error|fatal error)/g))malas.add(+m[1]);render()}
    if(out)h+=esc(out);
    if(perr2.trim())h+='<span class="e">'+esc(perr2)+'</span>';
    if(espera)estado('ru','Esperando que escribas…',ms);
    else if(d.signal)estado('er','Interrumpido ('+d.signal+')',ms);
    else if(st==='0')estado('ok','Terminó bien (código 0)',ms);
    else if(fallo)estado('er','Error de compilación',ms);
    else estado('er','Terminó con código '+st,ms);
    if(!h&&!espera)h='<span style="color:#808080">(el programa no escribió nada)</span>';
    pintarSalida(h,espera);
  }catch(e){
    if(mi!==corrida)return;
    estado('er','Sin conexión','');
    pintarSalida('<span class="e">'+(e.name==='AbortError'?'Tardó demasiado. ¿Bucle infinito?':'No se pudo conectar con el compilador.\nComprueba tu internet.\n('+esc(e.message)+')')+'</span>',false);
  }
}
run.onclick=()=>{
  malas.clear();render();entradas=[];
  salida.classList.add('on');$('out').innerHTML='';
  ejecutar();
};

document.documentElement.style.setProperty('--fs',S.fs+'px');cargar();
</script>
